[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-basefm"
version = "0.2.0"
description = "Apple Silicon and Apple Intelligence backends for DSPy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "zombat" }]
keywords = ["dspy", "apple", "mlx", "apple-intelligence", "on-device", "llm", "apple-basefm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No hard runtime dependencies: platform-specific packages are optional extras.
# This ensures `pip install apple-basefm` never fails on Linux.
dependencies = []

[project.optional-dependencies]

# Full DSPy integration (optimizers, history, callbacks, caching)
dspy = ["dspy>=2.5.0"]

# Apple Intelligence backend (macOS 26+, Apple Intelligence enabled)
# Includes apple-fm-sdk (now published on PyPI).
foundation = ["nest-asyncio>=1.6.0"]

# Apple Foundation Models SDK dependency (PyPI)
apple-fm-sdk = ["apple-fm-sdk>=0.1.0"]

# MLX backend (Apple Silicon, macOS 14+)
mlx = ["mlx>=0.22.0", "mlx-lm>=0.22.0", "huggingface_hub>=0.23"]

# Development and testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "dspy>=2.5.0",
]

# All optional runtime extras combined
all = ["apple-basefm[foundation,apple-fm-sdk,mlx,dspy]"]

[project.scripts]
"apple-basefm" = "apple_basefm._cli:main"

[project.urls]
Repository = "https://github.com/zombat/Apple-BaseFM"
"Bug Tracker" = "https://github.com/zombat/Apple-BaseFM/issues"
"DSPy PR" = "https://github.com/stanfordnlp/dspy/pull/9473"

[tool.hatch.build.targets.wheel]
packages = ["apple_basefm"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".hypothesis/",
    ".github/",
    "tests/",
    "scripts/",
    "examples/",
    ".gitignore",
    ".vscode/",
    "EDGECASES.md",
    "GOVERNANCE.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests/fuzz"]
norecursedirs = ["tests/integration"]
markers = [
    "unit: fast isolated tests with no external dependencies",
    "integration: tests requiring real infrastructure or hardware",
    "smoke: end-to-end tests against a running instance",
    "fuzz: property-based or randomised input tests (hypothesis)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
